<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<!-- 本图是「纸本水墨」固定浅色设计, 不随系统深浅色变化。
     手机浏览器 / Android WebView / 微信·QQ 的 X5 内核都会对「未声明 color-scheme 的页面」
     做算法暗化 (整页反色), 于是纸白被反成墨黑。声明 only light 是标准的退出方式:
     light 表示「只支持浅色」, 前缀 only 明确「不必替我自动暗化」。 -->
<meta name="color-scheme" content="only light">
<title>宗门模拟器 · 山河图</title>
<style>
  :root {
    /* 同上 (meta 是给浏览器看的, 这条是给渲染引擎看的): 明确只支持浅色, 拒绝自动暗化。
       顺带定死表单控件/滚动条的配色, 免在深色系统下被换成深色。 */
    color-scheme: only light;
    --paper: #ece3d0;
    --ink: #2e2a24;
    --ink-soft: rgba(58, 48, 38, 0.75);
    --ink-faint: rgba(58, 48, 38, 0.44);
    --seal: #a63a2c;
    --panel-border: rgba(150, 128, 96, 0.55);
    /* 小地图面板几何 —— 面板高 = --mm-h (画布) + --mm-chrome (头行+提示+内边距+间隙, 实测 57px)。
       #info (山川志) 的 bottom 由这几个变量推出: 早先写死成 230px/168px, 画布高度一变就会压到小地图上。 */
    --mm-h: 141px;          /* 小地图画布高度 (窄屏另给) */
    --mm-chrome: 57px;      /* 画布之外的面板垂直占位 */
    --mm-bottom: 18px;      /* 面板距视口底 */
    --mm-gap: 14px;         /* 山川志与小地图的间距 */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: var(--paper);
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "DFKai-SB", "Noto Serif SC", serif;
    color: var(--ink);
    user-select: none;
    -webkit-user-select: none;
  }
  #app { position: fixed; inset: 0; }
  #glcanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay { position: absolute; inset: 0; pointer-events: none; }

  /* ---- 水墨纸本 (所有面板共用) ----
     纸感 = 暖白纸色径向渐变 (底) + 两团极淡墨晕 (multiply, ::before),
     纯 CSS 叠出「宣纸 + 墨渍」, 不引入任何贴图资源。
     边框不用直线矩形: ① clip-path 切出轻微不规则的手撕纸边;
     ② ::after 以内缩细墨线作「双线画框」。 */
  .panel {
    /* 默认在流内 —— 顶栏靠 flex 排序。原先这里写 absolute, 顶栏两块面板全靠
       「无偏移的绝对定位」凑位置: 一旦其中一块回到流内, 另一块的静态位置就会
       跑到行首 (曾被这条坑到: 控件跑到左上、压住题名)。需要浮层的面板
       (#info / #minimapBox) 各自显式声明 absolute。 */
    position: relative;
    padding: 10px 13px;
    color: var(--ink);
    background:
      radial-gradient(120% 96% at 16% 8%, rgba(255,253,246,0.97), rgba(246,239,225,0.93) 52%, rgba(234,223,201,0.94)),
      linear-gradient(180deg, rgba(255,255,255,0.48), rgba(212,197,170,0.22));
    filter: drop-shadow(0 5px 12px rgba(74,55,28,0.26));
    clip-path: polygon(0.6% 1.1%, 78% 0.15%, 99.4% 0.9%, 100% 22%, 99.5% 79%, 100% 98.4%,
                       63% 99.85%, 2.5% 99.5%, 0% 76%, 0.4% 24%);
  }
  .panel::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(46% 34% at 88% 5%, rgba(52,44,34,0.10), rgba(52,44,34,0) 72%),
      radial-gradient(34% 26% at 5% 96%, rgba(52,44,34,0.09), rgba(52,44,34,0) 72%);
    mix-blend-mode: multiply;
  }
  .panel::after {
    content: ''; position: absolute; inset: 3px; pointer-events: none;
    border: 1px solid rgba(120, 98, 66, 0.3);
  }
  /* 墨线分隔: 两端化开的横线 */
  .ink-rule {
    height: 1px; margin: 7px 0;
    background: linear-gradient(90deg, rgba(46,42,36,0) 0%, rgba(46,42,36,0.5) 14%,
                rgba(46,42,36,0.32) 68%, rgba(46,42,36,0) 100%);
  }

  /* ---- 顶栏 ---- */
  #topbar {
    position: absolute;
    top: 14px; left: 16px; right: 16px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none;
  }
  #topbar > * { pointer-events: auto; }
  /* 左上纵列: 题名 + 本宗面板 (原「山河五色/种子」所在位) */
  #hudLeft { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  #titleBox { padding: 9px 15px 7px; }
  #titleBox h1 {
    font-size: 22px; font-weight: 700; letter-spacing: 6px;
    color: var(--ink);
  }
  #titleBox h1 em { font-style: normal; color: var(--seal); }
  #titleBox .sub { margin-top: 2px; font-size: 12px; color: var(--ink-soft); letter-spacing: 2px; }
  #controls { padding: 6px; }
  /* ---- 齿轮: 右上角只剩这一枚 (用户 2026-09-16: 「右上角改成一个齿轮, 点开后有弹窗」)。
     旧口径是 7 个按钮/输入框平铺 (#seedInput/btnSeed/btnRegen/btnVeins/btnLabels/btnBanners/
     btnClouds) —— 开关越加越挤, 且按钮外观就是状态 (刷新即丢)。现全部收进设置弹窗,
     状态由 ZMStore 持久化 (web/js/store.js)。 */
  #btnGear {
    display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; padding: 0;
    font-size: 19px; line-height: 1; letter-spacing: 0;
  }
  #btnGear.on { border-color: var(--seal); color: var(--seal); }

  /* ---- 设置弹窗 (水面纸卷轴) ----
     必须与 #topbar 内那枚齿轮**同级**放在 <body> 下: .panel 的 clip-path 会裁掉整棵子树,
     而弹窗要浮在视口正中 (锚在按钮下会被裁 / 窄屏放不下)。 */
  #settingsWrap {
    position: fixed; inset: 0; z-index: 72;
    display: flex; align-items: center; justify-content: center;
  }
  #settingsWrap.hidden { display: none; }
  #settingsMask { position: absolute; inset: 0; background: rgba(30,24,15,0.32); }
  #settingsBox {
    position: relative; width: 336px; max-width: calc(100vw - 28px);
    max-height: calc(100vh - 44px); overflow-y: auto; padding: 12px 15px 14px;
  }
  .set-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .set-title { font-size: 14px; letter-spacing: 3px; color: var(--ink); }
  #btnSetClose { padding: 1px 6px; font-size: 12px; letter-spacing: 0; border: none; background: none; color: var(--ink-soft); }
  #btnSetClose:hover { color: var(--seal); }
  .set-cap { margin: 2px 0 4px; font-size: 11.5px; letter-spacing: 4px; color: var(--ink-faint); }
  .set-item {
    display: flex; align-items: baseline; gap: 8px; padding: 3px 3px;
    font-size: 13px; cursor: pointer;
  }
  .set-item:hover { background: rgba(166,58,44,0.07); }
  .set-item input { margin: 0; transform: translateY(1px); accent-color: #a63a2c; }
  .set-item .nm { flex: 0 0 auto; width: 58px; letter-spacing: 2px; color: var(--ink); }
  .set-item .dsc { font-size: 11.5px; color: var(--ink-faint); }
  .set-kv { display: flex; justify-content: space-between; gap: 10px; margin: 3px 0; font-size: 12.5px; }
  .set-kv .k { color: var(--ink-soft); letter-spacing: 2px; }
  .set-kv .v { color: var(--ink); }
  .set-kv .v b { font-weight: 400; color: var(--seal); }
  #btnRegen { display: block; width: 100%; margin-top: 7px; padding: 6px 0; letter-spacing: 4px; }
  #btnRegen[disabled] { opacity: 0.45; cursor: default; border-color: var(--panel-border); color: var(--ink-soft); }
  .set-note { margin-top: 7px; font-size: 11px; line-height: 1.75; color: var(--ink-faint); }
  .set-note b { font-weight: 400; color: var(--ink-soft); }
  .set-msg { margin-top: 4px; font-size: 12px; letter-spacing: 1px; color: var(--seal); }
  .set-msg:empty { display: none; }
  button {
    padding: 4px 12px; cursor: pointer;
    border: 1px solid var(--panel-border); border-radius: 2px;
    background: linear-gradient(180deg, rgba(255,252,244,0.95), rgba(238,229,208,0.9));
    color: var(--ink); font-family: inherit; font-size: 13px; letter-spacing: 2px;
    transition: all 0.15s;
  }
  button:hover { border-color: var(--seal); color: var(--seal); }
  button.primary { border-color: var(--seal); color: var(--seal); }
  button.off { opacity: 0.45; text-decoration: line-through; }
  button.on { border-color: var(--seal); color: var(--seal); }
  #btnPlace { letter-spacing: 3px; }
  #stats { font-size: 12px; color: var(--ink-soft); letter-spacing: 1px; }

  /* ---- 卜居浮层 (方案 §4.4) ----
     ⚠ 必须与 #topbar **同级**放在 <body> 下: `.panel` 的 clip-path 会裁掉整棵子树
       (弹窗/全屏小地图踩过同一条)。顶栏左右两块面板已占满, 故取视口顶部居中。
     pointer-events 保持 auto: 它是可交互的 (起名/品阶/取消), 且它下面的画布仍能收
     到拖动 —— 面板只覆盖自己那块 (没有铺满全屏的遮罩)。 */
  #placeBox {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    z-index: 66; width: 306px; max-width: calc(100vw - 24px); padding: 9px 13px 11px;
  }
  #placeBox.hidden { display: none; }
  #placeBox .pb-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #placeBox .pb-title { font-size: 13px; letter-spacing: 5px; color: var(--ink); }
  #placeBox .pb-title b { font-weight: 400; color: var(--seal); }
  #btnPlaceClose { padding: 1px 6px; font-size: 12px; letter-spacing: 0; border: none; background: none; color: var(--ink-soft); }
  #btnPlaceClose:hover { color: var(--seal); }
  .pb-row { display: flex; align-items: center; gap: 7px; margin: 6px 0; font-size: 12.5px; }
  .pb-row .k { flex: 0 0 auto; letter-spacing: 2px; color: var(--ink-soft); }
  #placeName {
    flex: 1; min-width: 0; padding: 3px 6px; font-family: inherit; font-size: 13px;
    color: var(--ink); letter-spacing: 1px;
    border: 1px solid var(--panel-border); border-radius: 2px;
    background: linear-gradient(180deg, rgba(255,253,246,0.95), rgba(238,229,208,0.9));
  }
  #placeName:focus { outline: none; border-color: var(--seal); }
  #placeTier {
    padding: 3px 6px; font-family: inherit; font-size: 12.5px; color: var(--ink);
    border: 1px solid var(--panel-border); border-radius: 2px;
    background: linear-gradient(180deg, rgba(255,253,246,0.95), rgba(238,229,208,0.9));
  }
  #placeMsg { min-height: 17px; margin-top: 3px; font-size: 12.5px; line-height: 1.5; letter-spacing: 1px; }
  #placeMsg.ok  { color: #3a6b46; }
  #placeMsg.bad { color: var(--seal); }
  #placeMsg.busy { color: var(--ink-soft); }
  .pb-kv { display: flex; justify-content: space-between; gap: 8px; margin: 2px 0; font-size: 12px; color: var(--ink-soft); }
  .pb-kv .v { color: var(--ink); }
  .pb-kv .v.bad { color: var(--seal); }
  .pb-hint { margin-top: 5px; font-size: 11px; line-height: 1.7; color: var(--ink-faint); }

  /* ---- 本宗面板 (代替原「山河五色」图例) ----
     2026-09-23 十二版: 旧「宗门录 + 择宗」整条闭环下线 —— 本面板只显示玩家
     **自己的**宗门 (数据源 = 服务端 PlayerSect 表, 见 docs/玩家信息表设计.md)。
     ⚠ 「看其他宗门/聚落的详情」不在本面板, 已移入独立模块 js/infocard.js。
     #sectWrap 仍作定位上下文保留 (将来若在本面板上挂浮层: .panel 的 clip-path
     会裁剪整个子树 ⇒ 浮层必须与 #sectBox 平级放在 #sectWrap 里)。 */
  #sectWrap { position: relative; }
  #sectBox { width: 246px; padding: 9px 12px 11px; }
  #sectHead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #sectHead .cap { font-size: 13px; letter-spacing: 5px; color: var(--ink); }
  #sectHead .cap b { font-weight: 400; color: var(--seal); }
  .sec-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .sec-name { font-size: 17px; line-height: 1.3; letter-spacing: 3px; color: var(--ink); }
  /* 朱砂印章: 宗门前二字竖排 */
  .sec-seal {
    flex: 0 0 auto; width: 32px; height: 32px; border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
    writing-mode: vertical-rl; text-orientation: upright;
    font-size: 12.5px; letter-spacing: 1px; color: rgba(250,241,228,0.95);
    background: var(--seal); opacity: 0.92;
    box-shadow: inset 0 0 0 1px rgba(252,242,228,0.42), inset 0 0 7px rgba(58,10,4,0.4);
  }
  .sec-sub { margin-top: 2px; font-size: 12px; letter-spacing: 2px; color: var(--ink-soft); }
  #sectBody .kv { display: flex; justify-content: space-between; gap: 10px; margin: 3px 0; font-size: 12.5px; }
  #sectBody .kv .k { flex: 0 0 auto; letter-spacing: 2px; color: var(--ink-soft); }
  #sectBody .kv .v { text-align: right; color: var(--ink); }
  .sec-cap { margin-top: 6px; font-size: 11.5px; letter-spacing: 3px; color: var(--ink-faint); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .tag {
    display: inline-flex; align-items: baseline; gap: 3px; padding: 1px 6px;
    font-size: 11.5px; letter-spacing: 1px; color: rgba(70,58,44,0.92);
    border: 1px solid rgba(150,128,96,0.45); border-radius: 2px;
    background: linear-gradient(180deg, rgba(255,253,246,0.8), rgba(236,227,205,0.7));
  }
  .tag b { font-weight: 400; color: var(--seal); }
  .sec-empty { padding: 12px 2px 8px; font-size: 12.5px; letter-spacing: 2px; color: var(--ink-faint); text-align: center; }

  /* ---- 信息面板 ---- */
  #info {
    position: absolute;
    /* R11: 左下角让给「山河小图」—— 山川志上移到它上方。
       偏移量由 --mm-* 推出 (不再写死 230px: 画布高度一变就得手工跟着调)。 */
    left: 16px; width: 228px; padding: 12px 14px;
    bottom: calc(var(--mm-bottom) + var(--mm-h) + var(--mm-chrome) + var(--mm-gap));
    transition: opacity 0.2s;
  }
  #info.hidden { opacity: 0; pointer-events: none; }
  #info h3 { font-size: 14px; letter-spacing: 3px; margin-bottom: 8px; display: flex; justify-content: space-between; }
  #infoClose { cursor: pointer; color: var(--ink-soft); border: none; background: none; font-size: 14px; padding: 0 2px; letter-spacing: 0; }
  #infoClose:hover { color: var(--seal); }
  #infoBody .row { display: flex; justify-content: space-between; margin: 3px 0; font-size: 12.5px; }
  #infoBody .k { color: var(--ink-soft); letter-spacing: 2px; }
  #infoBody .v { color: var(--ink); }
  #infoBody .v.big { color: var(--seal); font-size: 15px; }
  #infoBody .sep { border-top: 1px dashed var(--panel-border); margin: 6px 0; }

  /* ---- 小地图 (R11: 灵脉版 · 独立模块 minimap-vein.js) ----
     默认档贴屏幕左下角: 中心跟随主相机, 滚轮调「与大地图恒定的倍率」, 拖动转自由视角,
     单击展开全屏档 (可拖动/缩放)。倍率持久化在 localStorage (zongmen.mmView)。
     隐藏 = 模块整体停摆 (停 rAF/停抽样/停绘制), 角落留一枚极小恢复钮。 */
  #minimapBox {
    position: absolute;
    left: 16px; bottom: var(--mm-bottom); padding: 7px 8px 6px;
  }
  #minimapBox.mm-hidden, #mmRestore.mm-hidden { display: none; }
  #minimapBox .mm-head, #mmFull .mm-head {
    display: flex; align-items: center; gap: 6px; margin-bottom: 5px;
  }
  #minimapBox .mm-head .mm-title, #mmFull .mm-head .mm-title {
    font-size: 12px; letter-spacing: 2px; color: var(--ink-soft); flex: 1;
  }
  #minimapBox .mm-btn, #mmFull .mm-btn {
    padding: 1px 6px; font-size: 11px; line-height: 17px; letter-spacing: 1px;
  }
  #minimap {
    display: block; width: 216px; height: var(--mm-h); cursor: grab;
    border: 1px solid rgba(80,60,30,0.3);
    /* touch-action: none ⇒ 手势由模块自己处理 (单指拖动/双指捏合),
       否则浏览器会把这些手势吃掉去做滚动/页面缩放。 */
    touch-action: none;
  }
  #minimap:active { cursor: grabbing; }
  #minimapBox .hint { margin-top: 5px; font-size: 11px; color: var(--ink-soft); text-align: center; letter-spacing: 2px; cursor: default; }
  .mm-tip {
    position: fixed; display: none; z-index: 70; pointer-events: none;
    max-width: 260px; padding: 5px 9px; border-radius: 3px; white-space: pre-line;
    background: rgba(28,24,20,0.92); color: #ece2cd; font-size: 11.5px; line-height: 1.55;
    box-shadow: 0 3px 10px rgba(0,0,0,0.35);
  }
  /* 全屏浮层: 必须是 #minimapBox 的兄弟 —— .panel 的 clip-path 会裁掉子树 */
  #mmFull {
    position: fixed; inset: 0; z-index: 60; display: none;
    background: rgba(20,17,13,0.86); padding: 14px; box-sizing: border-box;
  }
  #mmFull.open { display: flex; flex-direction: column; }
  #mmFull .mm-head {
    background: rgba(240,232,214,0.94); color: #3a3226; padding: 5px 10px;
    border-radius: 3px; margin-bottom: 8px;
  }
  #mmFull .mm-head .mm-title { color: #6a5f4c; }
  #mmFull .mm-stage { position: relative; flex: 1; min-height: 0; }
  #mmCanvasFull {
    display: block; width: 100%; height: 100%; cursor: grab;
    border: 1px solid rgba(200,180,140,0.35);
    touch-action: none;             /* 同 #minimap: 全屏档的拖动/捏合也归模块 */
  }
  #mmCanvasFull:active { cursor: grabbing; }
  #mmRestore {
    position: absolute; left: 16px; bottom: var(--mm-bottom); z-index: 40;
    padding: 2px 9px; font-size: 11px; letter-spacing: 1px; opacity: 0.62;
  }
  #mmRestore.show { display: block; }

  /* ---- 致命错误 ---- */
  #fatal {
    display: none; position: fixed; inset: 0; z-index: 99;
    background: rgba(236, 227, 208, 0.96);
    flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    text-align: center; padding: 30px;
  }
  #fatal h2 { color: var(--seal); letter-spacing: 4px; }
  #fatalMsg { color: var(--ink-soft); font-size: 14px; max-width: 560px; line-height: 1.7; }

  @media (max-width: 760px) {
    #sectBox { width: 196px; }
    .sec-name { font-size: 15px; letter-spacing: 2px; }
    #titleBox h1 { font-size: 17px; letter-spacing: 3px; }
    /* 窄屏: 小地图铺满窗体宽度。
       原为左下角固定小卡 (画布 150×98): 头行「山河小图 归心 全屏 隐藏」与提示行的固有宽
       都是 188px, 绝对定位的收缩盒取最宽者 ⇒ 面板 204px, 画布只铺满 79.8%,
       右侧留 38px 空白纸 (手机上肉眼可见)。
       这里把面板 left/right 同时贴边 ⇒ 宽度确定, 画布 width:100% 才有意义。
       ⚠ 桌面档不能给 width:100%: 收缩盒里百分比宽会回落到画布 width 属性,
         而模块每帧都在改这个属性 (clientWidth×dpr) ⇒ 反馈环。 */
    :root { --mm-h: min(132px, 22vh); --mm-bottom: 10px; }
    #minimapBox { left: 10px; right: 10px; }
    #minimap { width: 100%; }
    #mmRestore { left: 10px; }
    #info { left: 10px; }
  }
</style>
</head>
<body>
  <div id="app">
    <canvas id="glcanvas"></canvas>
    <canvas id="overlay"></canvas>
  </div>

  <div id="topbar">
    <div id="hudLeft">
      <div id="titleBox" class="panel">
        <h1>宗门模拟器 <em>·</em> 山河图</h1>
        <div class="sub"><span id="era">岁次甲辰 · 春</span><span id="eraRound"></span></div>
      </div>
      <div id="sectWrap">
        <div id="sectBox" class="panel">
          <div id="sectHead">
            <span class="cap">本<b>宗</b></span>
          </div>
          <div class="ink-rule"></div>
          <div id="sectBody"><div class="sec-empty">尚未择地立宗</div></div>
        </div>
      </div>
    </div>
    <div id="controls" class="panel">
      <button id="btnPlace" title="卜居 · 择地立宗">卜居</button>
      <button id="btnGear" title="设置 · 显示项 / 世界" aria-label="设置">⚙</button>
    </div>
  </div>

  <!-- 卜居浮层: 落点校验提示 + 起名/品阶 (方案 §4.4)。
       与 #topbar 同级 —— .panel 的 clip-path 会裁掉子树, 塞进顶栏面板会被切。 -->
  <div id="placeBox" class="panel hidden">
    <div class="pb-head">
      <span class="pb-title">卜<b>居</b></span>
      <button id="btnPlaceClose" title="取消 (Esc)">✕</button>
    </div>
    <div class="ink-rule"></div>
    <div class="pb-row">
      <span class="k">名号</span>
      <input id="placeName" type="text" maxlength="12" placeholder="1~12 字" autocomplete="off">
    </div>
    <div class="pb-row">
      <span class="k">品阶</span>
      <select id="placeTier">
        <option value="1">下品宗门 · 领 6 格</option>
        <option value="2">中品宗门 · 领 7 格</option>
        <option value="3">上品宗门 · 领 8 格</option>
      </select>
      <span class="k" id="placeQuota"></span>
    </div>
    <div id="placeState"></div>
    <div id="placeMsg"></div>
    <div class="pb-hint">移动鼠标择地, 单击落定 · Esc 取消<br>朱砂 = 不可立 · 墨绿 = 可立</div>
  </div>

  <div id="info" class="panel hidden">
    <h3><span>山川志</span><button id="infoClose">✕</button></h3>
    <div id="infoBody"></div>
  </div>

  <!-- 设置弹窗 (右上角齿轮) —— 与 #topbar 同级: 面板的 clip-path 会裁掉子树,
       且弹窗要浮在视口正中 (锚在按钮下方会被裁 / 窄屏放不下)。 -->
  <div id="settingsWrap" class="hidden">
    <div id="settingsMask"></div>
    <div id="settingsBox" class="panel" role="dialog" aria-modal="true" aria-label="山河图设置">
      <div class="set-head">
        <span class="set-title">山 河 图 · 设 置</span>
        <button id="btnSetClose" title="关闭 (Esc)">✕</button>
      </div>
      <div class="ink-rule"></div>
      <div class="set-cap">显 示</div>
      <label class="set-item"><input type="checkbox" data-zm="veins">
        <span class="nm">灵脉</span><span class="dsc">峰体 · 地盘色环 · 七星花</span></label>
      <label class="set-item"><input type="checkbox" data-zm="nameSettle">
        <span class="nm">聚落名</span><span class="dsc">城镇 / 宗门 / 景点纸签</span></label>
      <label class="set-item"><input type="checkbox" data-zm="nameVein">
        <span class="nm">灵脉名</span><span class="dsc">灵脉签 · 签面敷五行色</span></label>
      <label class="set-item"><input type="checkbox" data-zm="nameRegion">
        <span class="nm">区域名</span><span class="dsc">山川注记淡字</span></label>
      <label class="set-item"><input type="checkbox" data-zm="domain">
        <span class="nm">领地圈</span><span class="dsc">各聚落的领地范围 (规模决定)</span></label>
      <label class="set-item"><input type="checkbox" data-zm="clouds">
        <span class="nm">云气</span><span class="dsc">云毯 · 地面云影</span></label>
      <div class="ink-rule"></div>
      <div class="set-cap">世 界</div>
      <div class="set-kv"><span class="k">轮次</span><span class="v" id="setRound">-</span></div>
      <div class="set-kv"><span class="k">种子</span><span class="v" id="setSeed">-</span></div>
      <div class="set-kv"><span class="k">来历</span><span class="v" id="setSeedSrc">-</span></div>
      <button id="btnRegen" class="primary">另 启 一 世</button>
      <div class="set-note">种子由服务器统一产生, 落在 <b>db/zongmen.sqlite</b> 的 World 表 ——
        刷新不掉世、多端同世界。URL 带 <b>?seed=</b> 时按调试口径覆盖 (不入账)。</div>
      <div class="ink-rule"></div>
      <div class="set-cap">山 河</div>
      <div id="stats">-</div>
      <div class="set-msg" id="setMsg"></div>
    </div>
  </div>

  <div id="minimapBox" class="panel">
    <div class="mm-head">
      <span class="mm-title">山河小图</span>
      <button class="mm-btn" data-mm="recenter" title="回到主视野中心 (倍率不变)">归心</button>
      <button class="mm-btn" data-mm="full" title="全屏查看 (可拖动/缩放)">全屏</button>
      <button class="mm-btn" data-mm="hide" title="隐藏小地图 (相关组件停摆)">隐藏</button>
    </div>
    <canvas id="minimap"></canvas>
    <div class="hint" title="滚轮/捏合缩放 · 拖动平移 (拖过会自动转自由视角) · 单击展开全屏 · 归心恢复跟随">跟随视野 · 倍率 ×1</div>
  </div>
  <button id="mmRestore" class="mm-hidden" title="显示小地图">显图</button>
  <!-- 提示层: 必须放在面板外 (面板 clip-path 会裁掉溢出的提示) -->
  <div id="mmTip" class="mm-tip"></div>

  <!-- 全屏档浮层: 与 #minimapBox 同级 (面板的 clip-path 会裁子树) -->
  <div id="mmFull">
    <div class="mm-head">
      <span class="mm-title">山河小图 · 全屏（拖动平移 · 滚轮/捏合缩放 · 单击跳转）</span>
      <button class="mm-btn" data-mm="reset">归位</button>
      <button class="mm-btn" data-mm="hide">隐藏</button>
      <button class="mm-btn" data-mm="close">关闭 ✕</button>
    </div>
    <div class="mm-stage">
      <canvas id="mmCanvasFull"></canvas>
    </div>
  </div>

  <div id="fatal">
    <h2>山河未成</h2>
    <div id="fatalMsg">-</div>
  </div>

  <script src="js/pb.js"></script>
  <script src="js/mapclient.js"></script>
  <script src="js/noiselib.js"></script>
  <!-- 全局存储组件 (localStorage 持久化的设置/分区读写) ——
       必须在使用它的 main.js **之前**; 与引擎/小地图无依赖, 位置只受此约束。 -->
  <script src="js/store.js"></script>
  <script src="js/vein-skin.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/bldg_ink.js"></script>
  <!-- 引擎单实例加载器: 必须在 minimap-vein.js 与 main.js **之前**
       (两边都只读它; 全站唯一 eval / 唯一 init(seed) 点, 见文件头注释) -->
  <script src="js/engine-local.js"></script>
  <script src="js/minimap-vein.js"></script>
  <script src="js/infocard.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
